<svg width="680" height="510" viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Block diagram of the STM32 iBUS motor driver firmware</title>
  <desc>RC transmitter to receiver over RF, receiver to STM32 over iBUS, an arm button feeding the STM32, and the STM32 driving two motor controllers, each driving a wheel motor.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="510" fill="#ffffff"/>

  <!-- Transmitter -->
  <rect x="240" y="40" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">FlySky i6</text>
  <text x="340" y="78" text-anchor="middle" font-size="12" fill="#185FA5">RC transmitter</text>

  <line x1="340" y1="96" x2="340" y2="123" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Receiver -->
  <rect x="240" y="124" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">FlySky FS-iA6B</text>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="#185FA5">RC receiver, iBUS out</text>

  <line x1="340" y1="180" x2="340" y2="209" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="355" y="199" font-size="12" fill="#0C447C">iBUS, USART6</text>

  <!-- Arm button -->
  <rect x="40" y="220" width="115" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="97.5" y="237" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Arm button</text>
  <text x="97.5" y="252" text-anchor="middle" font-size="12" fill="#5F5E5A">PE15 toggle</text>
  <line x1="155" y1="240" x2="174" y2="240" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <!-- STM32 -->
  <rect x="175" y="210" width="330" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">STM32F767ZI</text>
  <text x="340" y="250" text-anchor="middle" font-size="12" fill="#534AB7">iBUS parsing, motor mixing, failsafe</text>

  <line x1="340" y1="270" x2="340" y2="300" stroke="#534AB7" stroke-width="1"/>
  <path d="M340,300 L230,300 L230,329" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <path d="M340,300 L450,300 L450,329" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>

  <!-- Left controller -->
  <rect x="150" y="330" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="230" y="351" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Left ZS-X11H</text>
  <text x="230" y="369" text-anchor="middle" font-size="12" fill="#0F6E56">PWM, DIR, STOP</text>

  <!-- Right controller -->
  <rect x="370" y="330" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="351" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Right ZS-X11H</text>
  <text x="450" y="369" text-anchor="middle" font-size="12" fill="#0F6E56">PWM, DIR, STOP</text>

  <line x1="230" y1="380" x2="230" y2="419" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>
  <line x1="450" y1="380" x2="450" y2="419" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>

  <!-- Left motor -->
  <rect x="150" y="420" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="230" y="441" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Left motor</text>
  <text x="230" y="459" text-anchor="middle" font-size="12" fill="#0F6E56">BLDC + Hall sensor</text>

  <!-- Right motor -->
  <rect x="370" y="420" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="441" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Right motor</text>
  <text x="450" y="459" text-anchor="middle" font-size="12" fill="#0F6E56">BLDC + Hall sensor</text>
</svg>
